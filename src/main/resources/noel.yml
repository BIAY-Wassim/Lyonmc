# ─────────────────────────────── Noël sur LyonMC ───────────────────────────────
# Tout s'allume et s'éteint tout seul : MOTD, icône du serveur, calendrier de l'Avent,
# chasse au trésor, boss de Noël et page Noël du site. Après un changement : /lmc reload.

periode:
  # Du 1er décembre au 6 janvier (mois-jour, dates incluses)
  debut: "12-01"
  fin: "01-06"
  # Pour tester avant décembre : une fausse date du jour, ex. "2026-12-05" (laisser vide en temps normal)
  date-test: ""

# MOTD pendant Noël (remplace celui de config.yml). <jours_noel> = jours restants avant Noël.
motd:
  line1: "<gradient:#ffffff:#9fd3ff><bold>ʟʏᴏɴᴍᴄ</bold></gradient> <#ff6b6b>❄</#ff6b6b> <white>ɴᴏëʟ</white> <dark_gray>⏐</dark_gray> <gray>1.21.8</gray>"
  line2:
    - "<#ff6b6b>❄</#ff6b6b> <white>Calendrier de l'Avent</white> <gray>: un cadeau par jour</gray> <#7bd88f>/calendrier</#7bd88f>"
    - "<#9fd3ff>☃</#9fd3ff> <gray>Bataille de boules de neige au hub :</gray> <white>/bataille</white>"
    - "<#ffd86b>✦</#ffd86b> <gray>Chasse au trésor de Noël :</gray> <white>/tresor</white>"
    - "<#ff6b6b>❄</#ff6b6b> <gray>Plus que</gray> <white><jours_noel></white> <gray>avant Noël !</gray>"

# Icône du serveur : un bonnet de Noël est ajouté sur server-icon.png pendant la période.
# Pour une icône à toi : mets un fichier plugins/LyonAchievements/noel-icone.png (64 × 64).
icone: true

# ─────────────────────────────── Calendrier de l'Avent (/calendrier) ───────────────────────────────
# Une case par jour du 1er au 24 décembre. texte = ce que le site affiche une fois la case ouverte.
# items : MATIERE:quantité, ou MATIERE:quantité:enchantement=niveau,enchantement=niveau
calendrier:
  # Les cases ratées peuvent être ouvertes plus tard, jusqu'au 24 décembre
  rattrapage: true
  # Titre pour ceux qui ouvrent les 24 cases (défini dans recompenses.yml)
  titre-complet: lutin-2026
  jours:
    1: { texte: "200 pièces et 16 cookies", coins: 200, items: [COOKIE:16] }
    2: { texte: "250 pièces et 2 diamants", coins: 250, items: [DIAMOND:2] }
    3: { texte: "200 pièces et 3 pommes dorées", coins: 200, items: [GOLDEN_APPLE:3] }
    4: { texte: "300 pièces et 32 fioles d'expérience", coins: 300, items: [EXPERIENCE_BOTTLE:32] }
    5: { texte: "250 pièces et 16 émeraudes", coins: 250, items: [EMERALD:16] }
    6: { texte: "Saint-Nicolas : 500 pièces, 4 diamants et 8 tartes", coins: 500, items: [DIAMOND:4, PUMPKIN_PIE:8] }
    7: { texte: "250 pièces et 4 blocs de fer", coins: 250, items: [IRON_BLOCK:4] }
    8: { texte: "300 pièces et 8 perles de l'Ender", coins: 300, items: [ENDER_PEARL:8] }
    9: { texte: "250 pièces et 2 étiquettes", coins: 250, items: [NAME_TAG:2] }
    10: { texte: "400 pièces et 3 diamants", coins: 400, items: [DIAMOND:3] }
    11: { texte: "300 pièces et 32 fusées", coins: 300, items: [FIREWORK_ROCKET:32] }
    12: { texte: "350 pièces et 32 carottes dorées", coins: 350, items: [GOLDEN_CARROT:32] }
    13: { texte: "300 pièces et un livre Raccommodage", coins: 300, items: ["ENCHANTED_BOOK:1:mending=1"] }
    14: { texte: "400 pièces et 2 blocs d'émeraude", coins: 400, items: [EMERALD_BLOCK:2] }
    15: { texte: "500 pièces et un fragment de netherite", coins: 500, items: [NETHERITE_SCRAP:1] }
    16: { texte: "350 pièces et 16 obsidiennes", coins: 350, items: [OBSIDIAN:16] }
    17: { texte: "400 pièces et 48 fioles d'expérience", coins: 400, items: [EXPERIENCE_BOTTLE:48] }
