# ─────────────────────────────── Chasse au trésor (/tresor) ───────────────────────────────
# Un coffre de cadeaux est caché dans le monde survie (dans des zones déjà explorées), avec de faux coffres pièges autour.
# Chaque quête réussie donne un indice de plus : la zone se resserre jusqu'aux coordonnées exactes.
# Chaque joueur qui trouve le coffre a son cadeau ; le premier a un bonus.
tresor:
  enabled: true
  # true : seulement pendant la période de Noël ; false : toute l'année
  noel-seulement: true
  # Un nouveau coffre tous les N jours, à cette heure-là
  tous-les-jours: 5
  heure: "18:00"
  monde: "world"
  # Distance au spawn du monde (en blocs)
  distance-min: 250
  distance-max: 1200
  # Pas de coffre à moins de N blocs d'un home de joueur
  loin-des-homes: 80
  pieges: 2
  # Rayon des zones données par les indices (le dernier donne les coordonnées exactes)
  zones: [400, 120, 30]
  # Une quête par étape, tirée au hasard. types : casser (blocs), tuer (créatures), pecher, crafter
  quetes:
    1:
      - { type: casser, cible: "STONE,DEEPSLATE,COBBLESTONE,COBBLED_DEEPSLATE,ANDESITE,DIORITE,GRANITE,TUFF", nombre: 64, texte: "Mine 64 blocs de pierre" }
      - { type: casser, cible: "OAK_LOG,SPRUCE_LOG,BIRCH_LOG,JUNGLE_LOG,ACACIA_LOG,DARK_OAK_LOG,MANGROVE_LOG,CHERRY_LOG,PALE_OAK_LOG", nombre: 32, texte: "Coupe 32 bûches" }
    2:
      - { type: tuer, cible: "ZOMBIE,SKELETON,CREEPER,SPIDER,HUSK,STRAY,DROWNED,ZOMBIE_VILLAGER,WITCH,ENDERMAN,SLIME", nombre: 10, texte: "Élimine 10 monstres" }
      - { type: tuer, cible: "COW,PIG,SHEEP,CHICKEN,RABBIT", nombre: 8, texte: "Chasse 8 animaux pour le repas de Noël" }
    3:
      - { type: pecher, nombre: 5, texte: "Pêche 5 poissons" }
      - { type: casser, cible: "COAL_ORE,DEEPSLATE_COAL_ORE,IRON_ORE,DEEPSLATE_IRON_ORE,COPPER_ORE,DEEPSLATE_COPPER_ORE", nombre: 12, texte: "Mine 12 minerais de charbon, de fer ou de cuivre" }
    4:
      - { type: crafter, cible: "CAKE,PUMPKIN_PIE,COOKIE", nombre: 1, texte: "Prépare une douceur de Noël (gâteau, tarte ou cookies)" }
      - { type: crafter, cible: "TORCH,LANTERN,CAMPFIRE", nombre: 16, texte: "Fabrique 16 torches, lanternes ou feux de camp" }
  cadeau: { texte: "600 pièces, 3 diamants et 16 fioles d'expérience", coins: 600, items: [DIAMOND:3, EXPERIENCE_BOTTLE:16] }
  bonus-premier: { texte: "1 000 pièces de plus, un fragment de netherite et le titre Chasseur de trésor", coins: 1000, items: [NETHERITE_SCRAP:1], title: chasseur-de-tresor }

# ─────────────────────────────── Boss de Noël ───────────────────────────────
# Le boss mondial en version Noël (nom, tenue et renforts de Noël), à la date et l'heure indiquées.
boss:
  enabled: true
  date: "12-24"
  heure: "21:00"
  nom: "<gradient:#ff6b6b:#ffffff>Le Père Fouettard</gradient>"
  # Pour chaque joueur qui a combattu (en plus des récompenses habituelles)
  cadeau: { texte: "1 500 pièces, 2 diamants et un fragment de netherite", coins: 1500, items: [DIAMOND:2, NETHERITE_SCRAP:1] }
  # Objets qui tombent du boss à sa mort
  butin: [DIAMOND:6, GOLD_INGOT:16, COOKIE:32, EMERALD:12, GOLDEN_APPLE:4]
