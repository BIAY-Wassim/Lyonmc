    icon: TOTEM_OF_UNDYING
    price: 15000

# ───────────────────────── Parcours de récompenses ─────────────────────────
# Paliers débloqués automatiquement. Visibles avec /parcours.
# condition.type :
#   achievements (nombre), achievements-percent, challenges (nombre), challenges-percent,
#   category (arg = story, nether, end, adventure, husbandry, lyonmc ; catégorie terminée),
#   missions, mission-streak, login-streak, playtime-hours, boss-kills, coins-earned, titles
# reward : coins, title, color, trail, homes, xp-levels, items ["DIAMOND:2"],
#          commands ["give %player% minecraft:apple 1"] (console)
# announce: true -> annoncé à tout le serveur
paliers:
  premiers-pas:
    name: "Premiers pas"
    icon: OAK_SAPLING
    condition: { type: achievements, value: 5 }
    reward: { coins: 150, xp-levels: 3 }
  au-travail:
    name: "Au travail"
    icon: WRITABLE_BOOK
    condition: { type: missions, value: 5 }
    reward: { coins: 200, trail: notes }
  aventurier:
    name: "Aventurier"
    icon: LEATHER_BOOTS
    condition: { type: achievements-percent, value: 10 }
    reward: { coins: 300, color: menthe }
  fidele:
    name: "Fidèle"
    icon: CAKE
    condition: { type: login-streak, value: 7 }
    reward: { coins: 500, title: fidele, trail: coeurs }
  explorateur:
    name: "Explorateur"
    icon: COMPASS
    condition: { type: achievements-percent, value: 25 }
    reward: { coins: 600, homes: 1, items: ["DIAMOND:3"] }
  assidu:
    name: "Assidu"
    icon: BOOK
    condition: { type: missions, value: 25 }
    reward: { coins: 600, title: assidu, color: ciel }
  pionnier:
    name: "Pionnier"
    icon: CRAFTING_TABLE
    condition: { type: category, arg: story, value: 1 }
    reward: { coins: 500, title: pionnier }
  temeraire:
    name: "Téméraire"
    icon: IRON_SWORD
    condition: { type: challenges, value: 5 }
    reward: { coins: 800, title: temeraire }
  regulier:
    name: "Régulier"
    icon: CAMPFIRE
    condition: { type: mission-streak, value: 7 }
    reward: { coins: 1000, title: regulier, trail: runes }
  veteran:
    name: "Vétéran"
    icon: SHIELD
    condition: { type: achievements-percent, value: 50 }
    reward: { coins: 1500, color: lavande, homes: 1 }
    announce: true
  seigneur-nether:
    name: "Seigneur du Nether"
    icon: NETHERRACK
    condition: { type: category, arg: nether, value: 1 }
    reward: { coins: 1200, title: seigneur-nether }
  fermier:
    name: "Fermier émérite"
    icon: WHEAT
    condition: { type: category, arg: husbandry, value: 1 }
    reward: { coins: 1500, title: fermier }
  globe-trotteur:
    name: "Globe-trotteur"
    icon: FILLED_MAP
    condition: { type: category, arg: adventure, value: 1 }
    reward: { coins: 1500, title: globe-trotteur }
  conquerant-end:
    name: "Conquérant de l'End"
    icon: END_STONE
    condition: { type: category, arg: end, value: 1 }
    reward: { coins: 1500, title: conquerant-end }
  collectionneur:
    name: "Collectionneur"
    icon: NAME_TAG
    condition: { type: titles, value: 10 }
    reward: { coins: 2000 }
  infatigable:
    name: "Infatigable"
    icon: ENCHANTED_BOOK
    condition: { type: missions, value: 100 }
    reward: { coins: 3000, title: infatigable }
  tueur-de-colosse:
    name: "Tueur de Colosse"
    icon: WITHER_SKELETON_SKULL
    condition: { type: boss-kills, value: 5 }
    reward: { coins: 2500, title: tueur-de-colosse }
  maitre:
    name: "Maître"
    icon: DIAMOND_CHESTPLATE
    condition: { type: achievements-percent, value: 75 }
    reward: { coins: 3000, homes: 1, items: ["NETHERITE_INGOT:1"] }
    announce: true
  pilier:
    name: "Pilier du serveur"
    icon: BEACON
    condition: { type: playtime-hours, value: 100 }
    reward: { coins: 3000, title: pilier, homes: 1 }
    announce: true
  grand-maitre:
    name: "Grand Maître"
    icon: NETHERITE_CHESTPLATE
    condition: { type: achievements-percent, value: 90 }
    reward: { coins: 5000, trail: lueur }
    announce: true
  machine:
    name: "Machine"
    icon: SOUL_CAMPFIRE
    condition: { type: mission-streak, value: 30 }
    reward: { coins: 5000, title: machine }
    announce: true
  invincible:
    name: "Invincible"
    icon: TOTEM_OF_UNDYING
    condition: { type: challenges-percent, value: 100 }
    reward: { coins: 10000, title: invincible }
    announce: true
  legende:
    name: "Légende"
    icon: DRAGON_EGG
    condition: { type: achievements-percent, value: 100 }
    reward: { coins: 20000, color: arc-en-ciel, trail: totem }
    announce: true

# ───────────────────────── Récompense quotidienne ─────────────────────────
# Cycle de 7 jours (/recompense). Rater un jour remet la série à zéro.
daily-login:
  - { coins: 50 }
  - { coins: 75 }
  - { coins: 100, items: ["BREAD:16"] }
  - { coins: 150 }
  - { coins: 200, items: ["IRON_INGOT:16"] }
  - { coins: 300, xp-levels: 3 }
  - { coins: 600, items: ["DIAMOND:3"], xp-levels: 5 }

# ───────────────────────── Boutique ─────────────────────────
# Les titres et cosmétiques avec un "price" sont en vente dans /boutique.
shop:
  home-slot:
    price: 4000
    price-increase: 2000
    max: 3
