# ─────────────────────────────────────────────────────────────
#   Récompenses · LyonMC
#   Monnaie, titres, cosmétiques, parcours de paliers,
#   récompense quotidienne et boutique.
#   Textes au format MiniMessage. Après modification : /lmc reload
# ─────────────────────────────────────────────────────────────

currency:
  singular: "pièce"
  plural: "pièces"
  symbol: "⛁"
  # Offert à la première connexion
  starting-balance: 100

# Pièces gagnées à chaque nouveau succès, selon son type
achievement-coins:
  task: 15
  goal: 40
  challenge: 150

# ───────────────────────── Grades (automatiques) ─────────────────────────
# Le grade se calcule tout seul selon le pourcentage de succès obtenus.
# Il monte tout seul et s'affiche dans le chat devant le pseudo.
# Une fois Légende, le joueur peut choisir le grade affiché (/titres), sauf le premier (Novice).
grades:
  novice:
    display: "<gray>Novice"
    percent: 0
  aventurier:
    display: "<#b5e3b0>Aventurier"
    percent: 10
  explorateur:
    display: "<#8fd3c7>Explorateur"
    percent: 25
  veteran:
    display: "<#9ab8ff>Vétéran"
    percent: 50
  maitre:
    display: "<#c79bff>Maître"
    percent: 75
  grand-maitre:
    display: "<#ff9bd2>Grand Maître"
    percent: 90
  legende:
    display: "<gradient:#ffe29a:#ffb35c>Légende</gradient>"
    percent: 100

# ───────────────────────── Titres ─────────────────────────
# Affichés entre crochets devant le pseudo, en plus du grade. Le joueur choisit avec /titres.
