# ───────────────────────── Récompense quotidienne ─────────────────────────
# Cycle de 7 jours (/recompense). Rater un jour remet la série à zéro.
daily-login:
  - { coins: 50 }
  - { coins: 75 }
  - { coins: 100, items: ["BREAD:16"] }
  - { coins: 150 }
  - { coins: 200, items: ["IRON_INGOT:16"] }
  - { coins: 300, xp-levels: 3 }
  - { coins: 600, items: ["DIAMOND:3"], xp-levels: 5 }

# ───────────────────────── Boutique ─────────────────────────
# Les titres et cosmétiques avec un "price" sont en vente dans /boutique.
shop:
  home-slot:
    price: 4000
    price-increase: 2000
    max: 3

# ───────────────────────── Lots ─────────────────────────
# Lots donnés avec /lmc donner <joueur> <lot> [note] : boutique en ligne (Tebex...), concours, événements.
# Le joueur peut être hors ligne : il le recevra à sa prochaine connexion.
# Chaque lot donné est noté dans plugins/LyonAchievements/lots-donnes.log (historique).
#
# ⚠ Règles de Mojang pour les serveurs : ce qui est VENDU doit rester cosmétique
#   (titres, couleurs, traînées...). Pas de pièces, d'objets ni d'avantages en jeu contre de l'argent réel.
#   Les pièces et objets sont permis pour un concours ou un événement gratuit.
# Contenu possible (comme les paliers) : coins, title / titles, color, trail, homes, xp-levels, items, commands
#   nom : nom affiché · message : message au joueur · annonce : message à tout le serveur (vide = pas d'annonce)
lots:
  soutien:
    nom: "Pack Soutien"
    title: soutien
    color: aurore
    trail: coeurs
    message: "<accent>✦</accent> <gray>Merci pour ton soutien ! Tu as reçu le <white><lot></white>."
    annonce: "<accent>♥</accent> <white><player></white> <gray>soutient le serveur, merci à lui !"
  concours:
    nom: "Récompense de concours"
    coins: 2000
    message: "<accent>✦</accent> <gray>Bravo ! Tu as gagné la <white><lot></white>."
    annonce: "<accent>✦</accent> <white><player></white> <gray>a gagné un concours !"
