# ─────────────────────────────────────────────────────────────
#   Récompenses · LyonMC
#   Monnaie, titres, cosmétiques, parcours de paliers,
#   récompense quotidienne et boutique.
#   Textes au format MiniMessage. Après modification : /lmc reload
# ─────────────────────────────────────────────────────────────

currency:
  singular: "pièce"
  plural: "pièces"
  symbol: "⛁"
  # Offert à la première connexion
  starting-balance: 100

# Pièces gagnées à chaque nouveau succès, selon son type
achievement-coins:
  task: 15
  goal: 40
  challenge: 150

# ───────────────────────── Grades (automatiques) ─────────────────────────
# Le grade se calcule tout seul selon le pourcentage de succès obtenus.
# Il monte tout seul et s'affiche dans le chat devant le pseudo.
# Une fois Légende, le joueur peut choisir le grade affiché (/titres), sauf le premier (Novice).
grades:
  novice:
    display: "<gray>Novice"
    percent: 0
  aventurier:
    display: "<#b5e3b0>Aventurier"
    percent: 10
  explorateur:
    display: "<#8fd3c7>Explorateur"
    percent: 25
  veteran:
    display: "<#9ab8ff>Vétéran"
    percent: 50
  maitre:
    display: "<#c79bff>Maître"
    percent: 75
  grand-maitre:
    display: "<#ff9bd2>Grand Maître"
    percent: 90
  legende:
    display: "<gradient:#ffe29a:#ffb35c>Légende</gradient>"
    percent: 100

# ───────────────────────── Titres ─────────────────────────
# Affichés entre crochets devant le pseudo, en plus du grade. Le joueur choisit avec /titres.
# Un titre se débloque par un palier (plus bas), par une saison, ou s'achète (price).
titles:
  pionnier:
    display: "<#e6e6e6>Pionnier"
    description: "Terminer la catégorie Minecraft"
  seigneur-nether:
    display: "<#ff7a6b>Seigneur du Nether"
    description: "Terminer la catégorie Nether"
  conquerant-end:
    display: "<#d8b4ff>Conquérant de l'End"
    description: "Terminer la catégorie The End"
  globe-trotteur:
    display: "<#ffcf7a>Globe-trotteur"
    description: "Terminer la catégorie Aventure"
  fermier:
    display: "<#a8e07a>Fermier émérite"
    description: "Terminer la catégorie Agriculture"
  temeraire:
    display: "<#ff9a6b>Téméraire"
    description: "Réussir 5 défis"
  invincible:
    display: "<gradient:#ff6b6b:#ffb35c>Invincible</gradient>"
    description: "Réussir tous les défis"
  assidu:
    display: "<#9fd8ff>Assidu"
    description: "Terminer 25 missions"
  infatigable:
    display: "<#7ab8ff>Infatigable"
    description: "Terminer 100 missions"
  regulier:
    display: "<#ffd27a>Régulier"
    description: "Série de 7 jours de missions"
  machine:
    display: "<gradient:#ffd27a:#ff8a5c>Machine</gradient>"
    description: "Série de 30 jours de missions"
  fidele:
    display: "<#ffb3c7>Fidèle"
    description: "7 récompenses quotidiennes d'affilée"
  pilier:
    display: "<#e8c872>Pilier du serveur"
    description: "Jouer 100 heures"
  tueur-de-colosse:
    display: "<#ff6b6b>Tueur de Colosse"
    description: "Vaincre 5 fois le boss mondial"
  champion:
    display: "<gradient:#ffe29a:#ffb35c><bold>Champion</bold></gradient>"
    description: "Finir 1er d'une saison"
  finaliste:
    display: "<#ffd86b>Finaliste"
    description: "Finir sur le podium d'une saison"
  noctambule:
    display: "<#8c9eff>Noctambule"
    description: "En vente à la boutique"
    price: 2500
  batisseur:
    display: "<#d2b48c>Bâtisseur"
    description: "En vente à la boutique"
    price: 3000
  fortune:
    display: "<#ffd86b>Fortuné"
    description: "En vente à la boutique"
    price: 8000
  magnat:
    display: "<gradient:#ffd86b:#fff3b0>Magnat</gradient>"
    description: "En vente à la boutique"
    price: 30000

# ───────────────────────── Cosmétiques ─────────────────────────
# Couleur du pseudo (chat et tablist)
# value : "#hex", "gradient:#hex:#hex" ou "rainbow"
colors:
  menthe:
    display: "Menthe"
    value: "#9ff0c8"
    icon: LIME_DYE
  ciel:
    display: "Ciel"
    value: "#9fd8ff"
    icon: LIGHT_BLUE_DYE
  lavande:
    display: "Lavande"
    value: "#c9b3ff"
    icon: PURPLE_DYE
  corail:
    display: "Corail"
    value: "#ff9f8f"
    icon: RED_DYE
    price: 1500
  or:
    display: "Or"
    value: "#ffd86b"
    icon: YELLOW_DYE
    price: 4000
  aurore:
    display: "Aurore"
    value: "gradient:#ff9a8b:#ffd86b"
    icon: ORANGE_DYE
    price: 8000
  ocean:
    display: "Océan"
