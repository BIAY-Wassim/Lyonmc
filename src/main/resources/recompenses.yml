    display: "Notes"
    particle: NOTE
    icon: NOTE_BLOCK
  coeurs:
    display: "Cœurs"
    particle: HEART
    icon: POPPY
  runes:
    display: "Runes"
    particle: ENCHANT
    icon: ENCHANTED_BOOK
  flammes:
    display: "Flammes"
    particle: FLAME
    icon: BLAZE_POWDER
    price: 3000
  ames:
    display: "Âmes"
    particle: SOUL_FIRE_FLAME
    icon: SOUL_LANTERN
    price: 3000
  neige:
    display: "Neige"
    particle: SNOWFLAKE
    icon: SNOWBALL
    price: 3000
  cerisier:
    display: "Cerisier"
    particle: CHERRY_LEAVES
    icon: CHERRY_SAPLING
    price: 4000
  etincelles:
    display: "Étincelles"
    particle: ELECTRIC_SPARK
    icon: LIGHTNING_ROD
    price: 5000
  lueur:
    display: "Lueur"
    particle: GLOW
    icon: GLOW_INK_SAC
