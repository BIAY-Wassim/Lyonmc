# ─────────────────────────────────────────────────────────────
#   LyonAchievements · lyonmc.fr
# ─────────────────────────────────────────────────────────────
#
# Textes au format MiniMessage : https://docs.advntr.dev/minimessage/format.html
# <accent>...</accent> = couleur d'accent (theme.accent)
#
# Symboles qui s'affichent bien en jeu : ★ ☆ ♛ ✦ ✧ ⚡ ❤ ⌚ ⚔ ☠ ➤ ✔ ✘ ☺ ⚑ ✎ ☀ ☽ ⌛ ▸ •
# (les emoji en couleur type 📡 n'existent pas dans la police de Minecraft)
#
# Placeholders joueur :
#   <player> <done> <total> <percent> <bar> <rank> <ranked>
#   <challenges> <challenges_total> <goals> <goals_total> <tasks> <tasks_total>
#   <cat_ID_name> <cat_ID_done> <cat_ID_total>   (ID = story, nether, end, adventure, husbandry)
#   <last> <last_ago>
#   <session>  temps de jeu depuis la connexion     <playtime> temps de jeu total
#   <kills> (mobs + joueurs) <mob_kills> <player_kills> <deaths>
#   <ping> <ping_bars>   <world>
#   Nametag uniquement : <health> <max_health>
#   <coins> <title> <team> <team_name> <season_points> <season_rank> <streak> <daily_done> <daily_total>
#   <weekly_done> <missions_done>
# Placeholders serveur :
#   <top1_name> <top1_done> ... <top5_name> <top5_done>
#   <online> <max_online> <tps> <date>
#   <server_total>  succès débloqués par tous les joueurs
#   <last_global_player> <last_global_adv> <last_global_ago>  dernier succès du serveur
#   <season> <season_name> <season_left> <season_top1_name> <season_top1_points> ... <weekend_line>
#
# Les autres réglages sont dans missions.yml, recompenses.yml et evenements.yml.

# Ne pas modifier
config-version: 6

theme:
  accent: "#e8c872"

# Fonctionnalités (false = désactivée)
modules:
  economy: true
  missions: true
  teams: true
  teleport: true
  hdv: true
  boss: true
  resource-world: true
  custom-advancements: true

# Homes, /spawn, /tpa, /rtp
teleport:
  warmup-seconds: 3
  homes-base: 2
  rtp:
    world: "world"
    min-radius: 500
    max-radius: 5000
    cooldown-seconds: 600

# Équipes
teams:
  max-members: 8
  create-cost: 1000

# Hôtel des ventes
hdv:
  max-listings: 5
  tax-percent: 5
  duration-hours: 48
  min-price: 1
  max-price: 1000000
  announce: true

# Monde ressources (réinitialisé chaque mois)
resource-world:
  enabled: true
  name: "ressources"
  border-radius: 3000
  monthly-reset: true

# Site lyonmc.fr : le plugin y écrit les classements, profils et le guide (JSON) toutes les minutes
web:
  enabled: true
  # Dossier "data" du site (doit appartenir à l'utilisateur qui lance le serveur Minecraft)
  export-path: "/var/www/lyonmc/data"
  interval-seconds: 60
  ip: "lyonmc.fr"
  discord: ""

# Annonces sur Discord (laisser vide pour désactiver)
# Discord : Paramètres du salon > Intégrations > Webhooks > Copier l'URL
discord:
  webhook-url: ""
  name: "LyonMC"

settings:
  update-interval-ticks: 20
  autosave-minutes: 5
  timezone: "Europe/Paris"
  exclude-root-advancements: false
  include-custom-advancements: true
  import-on-startup: true

# Site / carte en direct (dynmap)
map:
  url: "https://lyonmc.fr/carte"
  # /carte affiche ce message (lien cliquable)
  message: "<accent>➤</accent> <white>Dynmap</white> <gray>du serveur en direct : <click:open_url:'https://lyonmc.fr/carte'><hover:show_text:'<gray>Ouvrir la Dynmap'><white><u>lyonmc.fr/carte</u></white></hover></click>"

progress-bar:
  length: 20
  char: "|"
  filled-color: "#e8c872"
  empty-color: "#3a3a3a"

categories:
  story:
    name: "Minecraft"
    color: "#e6e6e6"
  nether:
    name: "Nether"
    color: "#e6e6e6"
  end:
    name: "The End"
    color: "#e6e6e6"
  adventure:
    name: "Aventure"
    color: "#e6e6e6"
  husbandry:
    name: "Agriculture"
    color: "#e6e6e6"

# ───────────────────────── Scoreboard ─────────────────────────
sidebar:
  enabled: true
  title: "<accent>✦</accent> <white><bold>LYONMC</bold></white> <accent>✦</accent>"
  lines:
    - "<dark_gray><date>"
    - ""
    - "<accent>➤</accent> <white><bold>Profil"
    - " <gray>Rang <accent>♛</accent> <white>#<rank></white><dark_gray>/<ranked>"
    - " <gray>Succès <accent>★</accent> <white><done></white><dark_gray>/<total>"
    - " <gray>Pièces <accent>⛁</accent> <white><coins>"
    - ""
    - "<accent>➤</accent> <white><bold>Aujourd'hui"
    - " <gray>Missions <accent>✔</accent> <white><daily_done></white><dark_gray>/<daily_total> · série <white><streak>"
    - " <gray>Saison <accent>✦</accent> <white><season_points></white> <dark_gray>pts · #<season_rank>"
    - "<weekend_line>"
    - "<accent>➤</accent> <white><bold>Serveur"
    - " <gray>En ligne <white>☺ <online></white><dark_gray>/<max_online></dark_gray> <ping_bars>"
    - ""
    - "<white>/menu</white> <dark_gray>·</dark_gray> <accent>lyonmc.fr"

# ───────────────────────── Tablist ─────────────────────────
tablist:
  enabled: true
  header:
    - ""
    - "<accent>✦</accent> <white><bold>LYONMC</bold></white> <accent>✦</accent>"
    - "<dark_gray>Survie · 1.21.8"
    - ""
    - "<accent>★</accent> <white><done></white><dark_gray>/<total> succès</dark_gray>     <accent>♛</accent> <white>#<rank></white><dark_gray>/<ranked></dark_gray>     <accent>⛁</accent> <white><coins></white>     <accent>✦</accent> <white><season_points></white> <dark_gray>pts"
    - ""
  footer:
    - ""
    - "<#ffd86b>♛</#ffd86b> <white><top1_name></white> <dark_gray><top1_done></dark_gray>     <#c8c8c8>✧</#c8c8c8> <white><top2_name></white> <dark_gray><top2_done></dark_gray>     <#d29a6a>✧</#d29a6a> <white><top3_name></white> <dark_gray><top3_done>"
    - ""
    - "<gray>☺ <white><online></white><dark_gray>/<max_online></dark_gray>     ⚡ <ping_bars> <white><ping></white><dark_gray>ms</dark_gray>     ✔ <white><tps></white> <dark_gray>tps"
    - "<white>/menu</white> <dark_gray>·</dark_gray> <white>Dynmap</white> <accent>lyonmc.fr"
    - ""
  name-format:
    top1: "<#ffd86b>♛</#ffd86b> <team><name>"
    top2: "<#c8c8c8>✧</#c8c8c8> <team><name>"
    top3: "<#d29a6a>✧</#d29a6a> <team><name>"
    other: "<dark_gray>#<rank></dark_gray> <team><name>"
    unranked: "<team><name>"
  show-score: true
  score-color: "#e8c872"
  sort-by-rank: true

# ───────────────────────── Au-dessus des joueurs ─────────────────────────
nametag:
  enabled: true
  prefix:
    top1: "<#ffd86b>♛ #1</#ffd86b> <team>"
    top2: "<#c8c8c8>✧ #2</#c8c8c8> <team>"
    top3: "<#d29a6a>✧ #3</#d29a6a> <team>"
    other: "<dark_gray>#<rank></dark_gray> <team>"
    unranked: "<team>"
  below: "<white><health></white><red>❤</red>  <dark_gray>·</dark_gray>  <accent>★</accent> <white><done></white><dark_gray>/<total>"

# ───────────────────────── Chat ─────────────────────────
chat:
  enabled: true
  # <badge> rang, <team> tag d'équipe, <title> titre choisi, <name> pseudo (coloré, survolable)
  format: "<badge><team><title><name> <dark_gray>›</dark_gray> <message>"
  team-format: "<team><dark_gray>(équipe)</dark_gray> <name> <dark_gray>›</dark_gray> <#bfe3ff><message>"
  badge:
    top1: "<#ffd86b>♛</#ffd86b> "
    top2: "<#c8c8c8>✧</#c8c8c8> "
    top3: "<#d29a6a>✧</#d29a6a> "
    other: "<dark_gray>#<rank></dark_gray> "
    unranked: ""
  name-color: "#e6e6e6"
  message-color: "#c4c4c4"
  hover:
    - "<white><bold><player></bold>"
    - "<dark_gray>♛ Rang #<rank> sur <ranked>"
    - ""
    - "<accent>★</accent> <gray>Succès <white><done></white><dark_gray>/<total>"
    - "<bar>"
    - "<accent>✦</accent> <gray>Défis <white><challenges></white><dark_gray>/<challenges_total>"
    - "<accent>⛁</accent> <gray>Pièces <white><coins>"
    - "<accent>✦</accent> <gray>Saison <white><season_points></white> <dark_gray>pts (#<season_rank>)"
    - "<accent>✔</accent> <gray>Série de missions <white><streak></white> <dark_gray>j"
    - "<accent>⌚</accent> <gray>Temps de jeu <white><playtime>"
    - "<accent>⚔</accent> <gray>Kills <white><kills></white> <dark_gray>·</dark_gray> <gray>Morts <white><deaths>"
    - ""
    - "<gray>Dernier succès"
    - "<white><last></white> <dark_gray><last_ago>"
    - ""
    - "<accent>➤ Cliquer pour voir le profil"
  join-message: "<dark_gray>[<green>+</green>]</dark_gray> <gray><player>"
  quit-message: "<dark_gray>[<red>-</red>]</dark_gray> <gray><player>"
  first-join-message: "<accent>✦</accent> <gray>Bienvenue à <white><player></white> sur <accent>lyonmc.fr</accent> !"
  # Message affiché au joueur à sa connexion
  welcome:
    enabled: true
    lines:
      - ""
      - "  <accent>✦</accent> <white><bold>LYONMC</bold></white> <dark_gray>·</dark_gray> <gray>Survie 1.21.8"
      - ""
      - "  <gray>Content de te revoir, <white><player></white>."
      - "  <accent>★</accent> <white><done></white><dark_gray>/<total></dark_gray> <gray>succès   <accent>♛</accent> <white>#<rank></white><dark_gray>/<ranked></dark_gray>   <accent>✦</accent> <white><challenges></white><dark_gray>/<challenges_total></dark_gray> <gray>défis"
      - "  <bar> <dark_gray><percent>%"
      - ""
      - "  <gray>Leader : <white><top1_name></white> <dark_gray>(★ <top1_done>)"
      - "  <gray>Dernier exploit : <white><last_global_player></white> <dark_gray>·</dark_gray> <last_global_adv>"
      - ""
      - "  <accent>⛁</accent> <white><coins></white> <gray>pièces   <accent>✔</accent> <gray>missions du jour <white><daily_done></white><dark_gray>/<daily_total></dark_gray>   <gray>série <white><streak></white> <dark_gray>j"
      - ""
      - "  <accent>➤</accent> <click:run_command:'/menu'><hover:show_text:'<gray>Ouvrir le menu'><white><u>/menu</u></white></hover></click> <gray>tout le serveur en un clic"
      - "  <accent>➤</accent> <click:run_command:'/missions'><hover:show_text:'<gray>Voir les missions'><white><u>/missions</u></white></hover></click> <gray>tes missions du jour"
      - "  <accent>➤</accent> <click:open_url:'https://lyonmc.fr'><hover:show_text:'<gray>Ouvrir la Dynmap'><white><u>lyonmc.fr</u></white></hover></click> <gray>pour voir la <white>Dynmap</white> en direct"
      - ""

below-name:
  enabled: false

# ───────────────────────── Liste des serveurs ─────────────────────────
motd:
  enabled: true
  # Centre automatiquement les deux lignes
  center: true
  # Largeur de la zone MOTD en pixels (à ajuster si le centrage est légèrement décalé)
  width: 264
  line1: "<gradient:#ffe29a:#ffb35c><bold>ʟʏᴏɴᴍᴄ</bold></gradient> <dark_gray>⏐</dark_gray> <white>ꜱᴜʀᴠɪᴇ</white> <gray>1.21.8</gray>"
  # Ligne 2 : une phrase au hasard à chaque rafraîchissement
  line2:
    - "<#ffb35c>✦</#ffb35c> <white>Dynmap</white> <gray>en direct sur</gray> <#ffe29a>lyonmc.fr</#ffe29a> <#ffb35c>✦</#ffb35c>"
    - "<#ff6b6b><bold>NEW</bold></#ff6b6b> <gray>Missions, saisons, boss mondial,</gray> <white>HDV</white>"
    - "<#ffe29a>★</#ffe29a> <white><server_total></white> <gray>succès débloqués par la communauté</gray>"
    - "<#ffe29a>♛</#ffe29a> <white><top1_name></white> <gray>mène avec</gray> <white><top1_done></white> <gray>succès</gray>"
  # Au survol du nombre de joueurs (couleurs simples uniquement)
  hover:
    - "<gold><bold>LYONMC</bold> <gray>· Survie 1.21.8"
    - ""
    - "<gold>♛ <white><top1_name> <dark_gray><top1_done>"
    - "<gray>✧ <white><top2_name> <dark_gray><top2_done>"
    - "<gold>✧ <white><top3_name> <dark_gray><top3_done>"
    - ""
    - "<gray>★ <white><server_total> <gray>succès débloqués"
    - "<white>Dynmap <gray>sur <gold>lyonmc.fr"
  show-online-players: true

# ───────────────────────── Annonces ─────────────────────────
announcements:
  replace-vanilla: true
  message: "<accent>★</accent> <gray><player> a obtenu <advancement> <dark_gray><done>/<total>"
  challenge-message: "<accent>✦</accent> <gray><player> a relevé le défi <advancement> <dark_gray><done>/<total>"
  challenge-title: "<accent>✦ <white>Défi accompli</white> ✦"
  challenge-subtitle: "<advancement>"
  milestones: [25, 50, 75, 90]
  milestone-message: "<accent>★</accent> <gray><player> a atteint <accent><milestone> %</accent> des succès !"
  new-leader-message: "<#ffd86b>♛</#ffd86b> <gray><player> prend la <accent>première place</accent> avec <white><done></white> succès !"
  rank-up-message: "<accent>➤</accent> <gray>Tu passes <white>#<rank></white> au classement des succès."
  all-completed-message: "<accent>✦ <player> a obtenu l'intégralité des succès du serveur ! ✦"

messages:
  prefix: "<accent>★</accent> <dark_gray>·</dark_gray> "
  no-permission: "<gray>Tu n'as pas la permission."
  player-not-found: "<gray>Joueur introuvable ou jamais classé."
  players-only: "<gray>Commande réservée aux joueurs."
  sidebar-on: "<gray>Scoreboard activé."
  sidebar-off: "<gray>Scoreboard masqué."
  reloaded: "<gray>Configuration rechargée."
  import-started: "<gray>Import des succès depuis les fichiers du monde..."
  import-done: "<gray>Import terminé : <white><count></white> joueurs analysés."
