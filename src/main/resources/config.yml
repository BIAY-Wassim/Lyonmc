# ─────────────────────────────────────────────────────────────
#   LyonAchievements · lyonmc.fr
# ─────────────────────────────────────────────────────────────
#
# Textes au format MiniMessage : https://docs.advntr.dev/minimessage/format.html
# Le tag <accent>...</accent> utilise la couleur d'accent définie dans theme.accent.
#
# Placeholders :
#   <player> <done> <total> <percent> <bar> <rank> <ranked>
#   <challenges> <challenges_total> <goals> <goals_total> <tasks> <tasks_total>
#   <cat_ID_name> <cat_ID_done> <cat_ID_total>   (ID = story, nether, end, adventure, husbandry)
#   <last> <last_ago>
#   <top1_name> <top1_done> ... <top5_name> <top5_done>
#   <online> <max_online> <ping> <tps>
#   Nametag uniquement : <health> <max_health>

# Ne pas modifier
config-version: 2

theme:
  # Une seule couleur d'accent, le reste en blanc / gris
  accent: "#d9c08c"

settings:
  update-interval-ticks: 10
  autosave-minutes: 5
  exclude-root-advancements: false
  include-custom-advancements: true
  import-on-startup: true

progress-bar:
  length: 20
  char: "|"
  filled-color: "#d9c08c"
  empty-color: "#3a3a3a"

categories:
  story:
    name: "Minecraft"
    color: "#e6e6e6"
  nether:
    name: "Nether"
    color: "#e6e6e6"
  end:
    name: "The End"
    color: "#e6e6e6"
  adventure:
    name: "Aventure"
    color: "#e6e6e6"
  husbandry:
    name: "Agriculture"
    color: "#e6e6e6"

# ───────────────────────── Scoreboard ─────────────────────────
sidebar:
  enabled: true
  title: "<white><bold>LYONMC</bold>"
  lines:
    - "<dark_gray>Survie · 1.21.8"
    - ""
    - "<gray>Rang  <white>#<rank> <dark_gray>/ <ranked>"
    - "<gray>Succès  <white><done> <dark_gray>/ <total>"
    - "<bar>"
    - "<dark_gray><percent> % complété"
    - ""
    - "<gray>Minecraft  <white><cat_story_done><dark_gray>/<cat_story_total>"
    - "<gray>Nether  <white><cat_nether_done><dark_gray>/<cat_nether_total>"
    - "<gray>The End  <white><cat_end_done><dark_gray>/<cat_end_total>"
    - "<gray>Aventure  <white><cat_adventure_done><dark_gray>/<cat_adventure_total>"
    - "<gray>Agriculture  <white><cat_husbandry_done><dark_gray>/<cat_husbandry_total>"
    - "<gray>Défis  <accent><challenges></accent><dark_gray>/<challenges_total>"
    - ""
    - "<accent>lyonmc.fr"

# ───────────────────────── Tablist ─────────────────────────
tablist:
  enabled: true
  header:
    - ""
    - "<white><bold>LYONMC</bold>"
    - "<dark_gray>Survie · 1.21.8"
    - ""
    - "<gray>Succès <white><done></white><dark_gray>/<total>   <gray>Rang <white>#<rank></white><dark_gray>/<ranked>   <gray>Défis <white><challenges></white><dark_gray>/<challenges_total>"
    - ""
  footer:
    - ""
    - "<dark_gray>Classement"
    - "<accent>1.</accent> <white><top1_name></white> <dark_gray><top1_done></dark_gray>    <gray>2.</gray> <white><top2_name></white> <dark_gray><top2_done></dark_gray>    <gray>3.</gray> <white><top3_name></white> <dark_gray><top3_done></dark_gray>"
    - ""
    - "<dark_gray><online> en ligne · <ping> ms · <tps> tps"
    - "<accent>lyonmc.fr"
    - ""
  name-format:
    top1: "<accent>1</accent> <white><player>"
    top2: "<gray>2</gray> <white><player>"
    top3: "<gray>3</gray> <white><player>"
    other: "<dark_gray><rank></dark_gray> <gray><player>"
    unranked: "<gray><player>"
  show-score: true
  score-color: "#8a8a8a"
  sort-by-rank: true

# ───────────────────────── Au-dessus des joueurs ─────────────────────────
nametag:
  enabled: true
  # Devant le pseudo
  prefix:
    top1: "<accent>#1</accent> "
    top2: "<gray>#2</gray> "
    top3: "<gray>#3</gray> "
    other: "<dark_gray>#<rank></dark_gray> "
    unranked: ""
  # Ligne sous le pseudo
  below: "<white><health></white><dark_gray>/<max_health> PV  ·  </dark_gray><white><done></white><dark_gray>/<total> succès"

# ───────────────────────── Chat ─────────────────────────
chat:
  enabled: true
  # <badge> = rang, <name> = pseudo (survolable), <message> = message
  format: "<badge><name> <dark_gray>›</dark_gray> <message>"
  badge:
    top1: "<accent>#1</accent> "
    top2: "<gray>#2</gray> "
    top3: "<gray>#3</gray> "
    other: "<dark_gray>#<rank></dark_gray> "
    unranked: ""
  name-color: "#e6e6e6"
  message-color: "#bfbfbf"
  # Carte affichée au survol du pseudo
  hover:
    - "<white><bold><player></bold>"
    - "<dark_gray>Rang #<rank> sur <ranked>"
    - ""
    - "<gray>Succès  <white><done></white><dark_gray>/<total></dark_gray>"
    - "<bar>"
    - "<gray>Défis  <white><challenges></white><dark_gray>/<challenges_total>"
    - "<gray>Dernier  <white><last></white> <dark_gray><last_ago>"
    - ""
    - "<accent>Cliquer pour voir le profil"
  join-message: "<dark_gray>+ <gray><player>"
  quit-message: "<dark_gray>- <gray><player>"
  first-join-message: "<gray>Bienvenue à <white><player></white> sur <accent>lyonmc.fr</accent>."

# Ancien affichage sous le pseudo (remplacé par "nametag")
below-name:
  enabled: false

# ───────────────────────── Annonces ─────────────────────────
announcements:
  replace-vanilla: true
  message: "<gray><player> a obtenu <advancement> <dark_gray><done>/<total>"
  challenge-message: "<gray><player> a relevé le défi <advancement> <dark_gray><done>/<total>"
  challenge-title: "<white>Défi accompli"
  challenge-subtitle: "<advancement>"
  milestones: [25, 50, 75, 90]
  milestone-message: "<gray><player> a atteint <accent><milestone> %</accent> des succès."
  new-leader-message: "<gray><player> prend la <accent>première place</accent> du classement avec <white><done></white> succès."
  rank-up-message: "<gray>Tu passes <white>#<rank></white> au classement des succès."
  all-completed-message: "<accent><player> a obtenu l'intégralité des succès du serveur."

messages:
  prefix: "<dark_gray>Succès · </dark_gray>"
  no-permission: "<gray>Tu n'as pas la permission."
  player-not-found: "<gray>Joueur introuvable ou jamais classé."
  players-only: "<gray>Commande réservée aux joueurs."
  sidebar-on: "<gray>Scoreboard activé."
  sidebar-off: "<gray>Scoreboard masqué."
  reloaded: "<gray>Configuration rechargée."
  import-started: "<gray>Import des succès depuis les fichiers du monde..."
  import-done: "<gray>Import terminé : <white><count></white> joueurs analysés."
