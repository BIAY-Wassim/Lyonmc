    grand-voyage: { type: WALK, amount: 15000, name: "Parcourir <amount> mètres", icon: DIAMOND_BOOTS }
    marchand:     { type: TRADE, amount: 24, name: "Faire <amount> échanges avec des villageois", icon: EMERALD_BLOCK }
    enchanteur:   { type: ENCHANT, amount: 8, name: "Enchanter <amount> objets", icon: EXPERIENCE_BOTTLE }

