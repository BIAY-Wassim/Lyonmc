# ═══════════════════════════════════════════════════════════════════════
#  Métiers LyonMC — /metiers
#  On progresse en jouant normalement : miner, couper du bois, récolter,
#  chasser, pêcher. Chaque niveau rapporte des pièces et augmente la chance
#  de « récolte double ». Les blocs posés par des joueurs ne rapportent rien.
#  Rien ne compte au hub, en créatif, ni quand le joueur est AFK.
# ═══════════════════════════════════════════════════════════════════════

reglages:
  actif: true
  niveau-max: 50
  # XP pour passer du niveau N au niveau N+1 : xp-base + xp-multiplicateur × N^xp-exposant
  # (avec ces valeurs : niveau 10 en ~30 min, niveau 25 en ~5 h, niveau 50 en ~25 h de jeu par métier)
  xp-base: 100
  xp-multiplicateur: 15
  xp-exposant: 1.6
  # Pièces gagnées en passant un niveau : pieces-par-niveau × nouveau niveau
  pieces-par-niveau: 20
  # Chance de récolte double (en %) gagnée à chaque niveau (0.5 → 25 % au niveau 50)
  bonus-par-niveau: 0.5
  # L'XP des métiers est multipliée dans le monde ressources
  multiplicateur-monde-ressources: 1.5
  # Les monstres des cages à monstres ne rapportent que ce pourcentage de l'XP
  cage-a-monstres: 0
  # Barre en haut de l'écran quand on gagne de l'XP (disparaît après quelques secondes)
  barre: true
  # Annonce à tout le serveur tous les 10 niveaux à partir de ce niveau (0 = jamais)
  annonce: 10

# Pour chaque métier :
#   blocs     : bloc cassé → XP (les cultures ne comptent que mûres)
#   recoltes  : clic droit sur des baies → XP
#   elevage   : XP quand on fait naître un animal
#   monstres  : créature tuée → XP (HOSTILE = monstre non listé, PASSIVE = animal non listé)
#   peche     : POISSON, TRESOR ou DECHET → XP
#   paliers   : récompenses en plus à certains niveaux (titres, cosmétiques, pièces...)
metiers:
