      DEEPSLATE: 1
      TUFF: 1
      GRANITE: 1
      DIORITE: 1
      ANDESITE: 1
      CALCITE: 1
      BLACKSTONE: 1
      BASALT: 1
      END_STONE: 1
      OBSIDIAN: 3
      COAL_ORE: 4
      DEEPSLATE_COAL_ORE: 5
      COPPER_ORE: 4
      DEEPSLATE_COPPER_ORE: 5
      IRON_ORE: 6
      DEEPSLATE_IRON_ORE: 7
      GOLD_ORE: 8
      DEEPSLATE_GOLD_ORE: 9
      NETHER_GOLD_ORE: 3
      REDSTONE_ORE: 5
      DEEPSLATE_REDSTONE_ORE: 6
      LAPIS_ORE: 6
      DEEPSLATE_LAPIS_ORE: 7
      NETHER_QUARTZ_ORE: 3
      DIAMOND_ORE: 20
      DEEPSLATE_DIAMOND_ORE: 22
      EMERALD_ORE: 25
      DEEPSLATE_EMERALD_ORE: 27
      ANCIENT_DEBRIS: 30
      AMETHYST_CLUSTER: 3
    # Récolte double : seulement pour ces blocs (pas avec Toucher de soie)
    double:
      - COAL_ORE
      - DEEPSLATE_COAL_ORE
      - COPPER_ORE
      - DEEPSLATE_COPPER_ORE
      - IRON_ORE
      - DEEPSLATE_IRON_ORE
      - GOLD_ORE
      - DEEPSLATE_GOLD_ORE
      - NETHER_GOLD_ORE
      - REDSTONE_ORE
      - DEEPSLATE_REDSTONE_ORE
      - LAPIS_ORE
      - DEEPSLATE_LAPIS_ORE
      - NETHER_QUARTZ_ORE
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
    paliers:
      10: { titles: [mineur-confirme], coins: 500 }
      25: { titles: [maitre-mineur], coins: 2000 }
      50: { titles: [legende-profondeurs], trail: eclats, coins: 10000 }

