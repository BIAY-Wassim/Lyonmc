# Site lyonmc.fr (dossier siteweb du serveur) + carte Dynmap
# Fichier : /etc/apache2/sites-available/lyonmc.conf
# Modules nécessaires : ssl proxy proxy_http headers rewrite
#
#   lyonmc.fr/          le site (accueil, classements, profils, guide)
#   lyonmc.fr/carte     page du site qui affiche la Dynmap
#   lyonmc.fr/dynmap/   la Dynmap seule (utilisée par la page Carte)

Define LYONMC_SITE /home/serveur/SSDM2/Event/LyonMc/siteweb
Define LYONMC_DYNMAP http://127.0.0.1:8134/

# HTTP : tout part en HTTPS
<VirtualHost *:80>
    ServerName lyonmc.fr
    ServerAlias www.lyonmc.fr

    RewriteEngine on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/lyonmc.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/lyonmc.fr-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName lyonmc.fr
    ServerAlias www.lyonmc.fr

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/lyonmc.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lyonmc.fr/privkey.pem

    # Le site
    DocumentRoot ${LYONMC_SITE}
    <Directory ${LYONMC_SITE}>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Les adresses comme /classements, /carte ou /joueur/Pseudo renvoient vers la page du site
        FallbackResource /index.html
    </Directory>

    # Données écrites par le plugin : jamais en cache, pas de page de secours
    <Directory ${LYONMC_SITE}/data>
        FallbackResource disabled
        Header set Cache-Control "no-cache"
    </Directory>

    # Icônes, polices et images : cache d'une semaine
    <LocationMatch "^/(img|assets)/">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>

    # Anciens liens de la Dynmap (lyonmc.fr/?worldname=...) : on les ouvre dans la page Carte
    RewriteEngine on
    RewriteCond %{QUERY_STRING} (^|&)worldname= [NC]
    RewriteRule ^/?$ /carte [R=302,L]

    # Dynmap (serveur web interne du plugin, webserver-port: 8134)
    RedirectMatch 301 ^/dynmap$ /dynmap/
    ProxyPreserveHost On
    ProxyPass        /dynmap/ ${LYONMC_DYNMAP}
    ProxyPassReverse /dynmap/ ${LYONMC_DYNMAP}
    <Location /dynmap/>
        # La carte doit pouvoir s'afficher dans la page Carte du site
        Header unset X-Frame-Options
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/lyonmc.fr-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/lyonmc.fr-ssl-access.log combined
</VirtualHost>
</IfModule>
