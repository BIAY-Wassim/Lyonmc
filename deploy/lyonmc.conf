# Site lyonmc.fr + carte Dynmap sur /carte/
# À copier dans /etc/apache2/sites-available/lyonmc.conf
# Modules nécessaires : sudo a2enmod proxy proxy_http headers

<VirtualHost *:80>
    ServerName lyonmc.fr
    ServerAlias www.lyonmc.fr

    DocumentRoot /var/www/lyonmc

    <Directory /var/www/lyonmc>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Les adresses comme /classements ou /joueur/Pseudo renvoient vers la page du site
        FallbackResource /index.html
    </Directory>

    # Données écrites par le plugin : jamais en cache, pas de page de secours
    <Directory /var/www/lyonmc/data>
        FallbackResource disabled
        Header set Cache-Control "no-cache"
    </Directory>

    # Icônes, polices et images : cache d'une semaine
    <LocationMatch "^/(img|assets)/">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>

    # Carte Dynmap (serveur web interne de Dynmap, port 8123 par défaut)
    RedirectMatch 301 ^/carte$ /carte/
    ProxyPreserveHost On
    ProxyPass        /carte/ http://127.0.0.1:8123/
    ProxyPassReverse /carte/ http://127.0.0.1:8123/

    ErrorLog ${APACHE_LOG_DIR}/lyonmc-error.log
    CustomLog ${APACHE_LOG_DIR}/lyonmc-access.log combined
</VirtualHost>
