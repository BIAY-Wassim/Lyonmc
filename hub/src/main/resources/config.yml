# ─────────────────────────────────────────────────────────────
#   HUB · LyonMC (par wassdead)
#   Monde du hub, PNJ (podium avec les vrais skins des joueurs) et parkour.
#   Après modification : /lyonhub reload
# ─────────────────────────────────────────────────────────────

# Mondes vides chargés au démarrage (créés avec /lyonhub monde)
worlds: [hub]

# Mondes qui ne comptent pas comme « la survie » pour /survie (en plus du hub)
hors-survie: [ressources]

# Ramène au spawn du monde les joueurs qui tombent dans le vide du hub
void-rescue: true

# ───────────────────────── Joueurs au hub ─────────────────────────
# Au hub, l'inventaire de survie est mis de côté (jamais supprimé, plugins/HUB/inventaires)
# et rendu en quittant le hub. Les joueurs sont en aventure et reçoivent ces objets.
# action : menu (menu du hub), jouer (choix du monde), survie, site, ou commande:<commande>
case-en-main: 0
objets:
  jouer:
    case: 0
    objet: COMPASS
    nom: "<green><bold>Jouer</bold> <gray>(clic droit)"
    description: ["<gray>Survie, monde ressources, homes..."]
    action: jouer
  profil:
    case: 2
    objet: PLAYER_HEAD
    nom: "<white><bold>Mon profil</bold> <gray>(clic droit)"
    description: ["<gray>Tes succès, ton grade, tes stats"]
    action: "commande:succes"
  menu:
    case: 4
    objet: NETHER_STAR
    nom: "<#e8c872><bold>Menu du hub</bold> <gray>(clic droit)"
    description: ["<gray>Classements, saison, missions, boutique..."]
    action: menu
  cosmetiques:
    case: 6
    objet: BLAZE_POWDER
    nom: "<#ffb35c><bold>Cosmétiques</bold> <gray>(clic droit)"
    description: ["<gray>Couleur du pseudo et traînées"]
    action: "commande:cosmetiques"
  classements:
    case: 8
    objet: GOLD_INGOT
    nom: "<gold><bold>Classements</bold> <gray>(clic droit)"
    description: ["<gray>Les meilleurs joueurs du serveur"]
    action: "commande:classement"

# Classements écrits par LyonAchievements (export du site), relatif au dossier du serveur
classements: "siteweb/data/classements.json"
# Relecture des classements (secondes)
refresh-seconds: 60

# Distance (blocs) à laquelle les PNJ apparaissent pour un joueur
view-distance: 48
# Aura autour des PNJ du podium (or, argent, bronze)
aura: true

# Classements possibles pour le podium : succes, saison, fortune, missions, metiers,
# mineur, bucheron, fermier, chasseur, pecheur (/lyonhub podium <classement> <place>)

# Commande lancée par le joueur qui clique sur un PNJ du podium (<player> = pseudo du PNJ)
podium-command: "succes <player>"

# Texte au-dessus des PNJ du podium. <rank> place, <board> classement, <player> pseudo, <value> score
labels:
  podium:
    - "<rank> <dark_gray>·</dark_gray> <gray><board>"
    - "<white><bold><player>"
    - "<gray><value>"
  empty:
    - "<rank> <dark_gray>·</dark_gray> <gray><board>"
    - "<dark_gray>Place libre"

# ───────────────────────── Parkour du hub ─────────────────────────
# Construis le parcours, pose des plaques de pression, puis debout sur chacune :
#   /lyonhub parkour depart · /lyonhub parkour etape (dans l'ordre) · /lyonhub parkour arrivee
#   /lyonhub parkour classement : affiche les meilleurs temps à l'endroit où tu es
# Les joueurs : /parkour (y aller), /parkour top (meilleurs temps)
parkour:
  enabled: true
  # Tomber de plus de X blocs sous la dernière étape : retour à l'étape
  chute-max: 8
  # Les temps plus courts que ça sont refusés (anti-triche, 0 = pas de limite)
  temps-minimum-secondes: 0
  # Une fois arrivé, retour au départ après 5 secondes (pour retenter son temps)
  retour-apres-arrivee: true
  # Récompense la première fois qu'on termine le parkour (commandes lancées par la console)
  recompense-commandes:
    - "eco give %player% 250"
    - "lmc titre %player% acrobate"
  message-premiere-fois: "<#9fffe0>✦</#9fffe0> <gray>Première fois : <white>250 pièces</white> et le titre <#9fffe0>Acrobate</#9fffe0> !"

# ───────────────────────── Village de Noël ─────────────────────────
# Le village enneigé (happychristmas.schem) dans son propre monde, à part du hub, avec l'arène de la bataille
# de boules de neige juste à côté : les joueurs ont la vue sur le village en jouant.
# Installation : mets happychristmas.schem dans plugins/HUB/schematics puis /lyonhub noel installer
# Les joueurs : /noel (y aller), /hub (revenir), /bataille (jouer), /bataille top (meilleurs joueurs)
noel:
  # Ouvert aux joueurs (/noel, PNJ, menu du hub). Mets false après les fêtes puis /lyonhub reload.
  actif: true
  # Monde à part pour le village et la bataille (monde vide créé par /lyonhub noel installer)
  monde: noel
  schematic: happychristmas
  # Coin du village (x y z) : l'arrivée tombe au centre du monde
  origine: "-84 -12 -120"
  # Bataille de boules de neige : des étages de neige en relief empilés ; on casse la neige sous les
  # pieds des autres à coups de boules de neige. Tomber sous le dernier étage = éliminé, le dernier debout gagne.
  bataille:
    actif: true
    # Centre de l'étage du haut (x y z). Vide = à côté du village, face au château
    centre: ""
    # Taille de l'arène : rayon, nombre d'étages, blocs entre deux étages, relief (0 = plat)
    rayon: 14
    etages: 3
    ecart: 7
    relief: 2
    # Plaques de glace glissantes sur les étages du bas
    glace: true
    joueurs-min: 2
    joueurs-max: 12
    # Attente avant le début, une fois assez de joueurs dans la file
    attente-secondes: 20
    # Au bout de ce temps, la neige fond toute seule (pour que la partie se termine)
    fonte-apres-secondes: 75
    fonte-duree-secondes: 90
    duree-max-secondes: 300
    # Récompense du gagnant (commandes console, %player% = pseudo), pour ses N premières victoires du jour
    recompense-victoire:
      - "eco give %player% 100"
    victoires-payees-par-jour: 5
    message-victoire: "<#9fd3ff>❄</#9fd3ff> <gray>Victoire : <white>100 pièces</white> !"
    # Titre au bout de N victoires
    titre-victoires: 5
    titre-commande: "lmc titre %player% roi-de-la-neige"
