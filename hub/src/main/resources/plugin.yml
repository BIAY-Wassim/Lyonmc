name: HUB
version: '${version}'
main: fr.lyonmc.hub.LyonHub
api-version: '1.21'
author: wassdead
description: HUB de LyonMC — monde du hub, podium de PNJ avec les vrais skins des joueurs et parkour
website: https://lyonmc.fr
# Le monde du hub doit exister avant que LyonAchievements place le spawn et les hologrammes
loadbefore: [LyonAchievements]

commands:
  lyonhub:
    description: Gestion du hub (monde, PNJ du podium)
    aliases: [lhub]
    permission: lyonhub.admin

  survie:
    description: Revenir là où tu étais dans le monde survie
    aliases: [survival]

  parkour:
    description: Le parkour du hub (départ, meilleurs temps)
    usage: /parkour [top|quitter]
    aliases: [pk]

permissions:
  lyonhub.admin:
    description: Gérer le hub et les PNJ
    default: op
