name: HUB
version: '${version}'
main: fr.lyonmc.hub.LyonHub
api-version: '1.21'
author: wassdead
description: HUB de LyonMC — monde du hub, podium de PNJ avec les vrais skins des joueurs, parkour et village de Noël
website: https://lyonmc.fr
# Le monde du hub doit exister avant que LyonAchievements place le spawn et les hologrammes
loadbefore: [LyonAchievements]

commands:
  lyonhub:
    description: Gestion du hub (monde, PNJ du podium)
    aliases: [lhub]
    permission: lyonhub.admin

  survie:
    description: Revenir là où tu étais dans le monde survie
    aliases: [survival]

  parkour:
    description: Le parkour du hub (départ, meilleurs temps)
    usage: /parkour [top|quitter]
    aliases: [pk]

  noel:
    description: Aller au village de Noël du hub
    aliases: [village, villagedenoel]

  bataille:
    description: Bataille de boules de neige du village de Noël
    usage: /bataille [quitter|top]
    aliases: [tumble, bdn, boulesdeneige]

permissions:
  lyonhub.admin:
    description: Gérer le hub et les PNJ
    default: op
