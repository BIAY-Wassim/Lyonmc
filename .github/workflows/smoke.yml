name: Test de démarrage

on:
  push:
    branches: [site]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Compiler
        run: |
          mvn -B -q package
          gradle -p hub build --no-daemon --console=plain -q
          gradle -p communaute build --no-daemon --console=plain -q
      - name: Préparer le serveur de test
        run: |
          mkdir -p srv/plugins
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/1.21.8/builds/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['downloads']['server:default']['url'])" || true)
          if [ -z "$URL" ]; then
            B=$(curl -s https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds | python3 -c "import sys,json;print(json.load(sys.stdin)['builds'][-1]['build'])")
            URL=https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/$B/downloads/paper-1.21.8-$B.jar
          fi
          curl -sL -o srv/paper.jar "$URL"
          for P in viaversion viabackwards; do
            V=$(curl -s "https://api.modrinth.com/v2/project/$P/version?loaders=%5B%22paper%22%5D" | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['files'][0]['url'])")
            curl -sL -o srv/plugins/$P.jar "$V"
          done
          cp target/LyonAchievements-*.jar srv/plugins/
          cp hub/build/libs/HUB-*.jar srv/plugins/
          cp communaute/build/libs/COMMUNAUTE-*.jar srv/plugins/
          mkdir -p srv/plugins/COMMUNAUTE
          printf 'anti-triche:\n  meme-ip-autorise: true\nparrainage:\n  heures-requises: 0.01\nvotes:\n  sites:\n    - { nom: "site-test", lien: "https://example.org/vote" }\n    - { nom: "serveurs-minecraft.org", lien: "http://www.serveurs-minecraft.org/vote.php?id=64115" }\n    - { nom: "site-ip-test", lien: "https://example.org/vote2", verification: "https://raw.githubusercontent.com/BIAY-Wassim/Lyonmc/main/communaute/test/vote-ok.json?ip={ip}" }\n  vote-party:\n    votes: 2\n' > srv/plugins/COMMUNAUTE/config.yml
          python3 hub/test/old_configs.py . srv
          pip install -q nbtlib numpy
          mkdir -p srv/plugins/HUB/schematics
          python3 hub/test/make_test_schem.py srv/plugins/HUB/schematics/test-hub.schem
          python3 hub/test/make_fake_medieval.py srv/plugins/HUB/schematics/hub-medieval.schem
          cd srv
          echo "eula=true" > eula.txt
          echo 'online-mode=false' > server.properties
          echo 'level-type=minecraft\:flat' >> server.properties
          echo 'spawn-protection=0' >> server.properties
          echo 'view-distance=4' >> server.properties
          echo 'simulation-distance=4' >> server.properties
          mkdir -p ../bot && cd ../bot && npm init -y >/dev/null && npm install --silent mineflayer >/dev/null
      - name: Écrire les bots
        run: |
          cat > bot/bot.js <<'JS'
          const mineflayer = require('mineflayer')
          const md = require('minecraft-data')
          const role = process.argv[2]
          const versions = md.supportedVersions.pc.filter(v => v.startsWith('1.21'))
          const version = versions.includes('1.21.8') ? '1.21.8' : versions[versions.length - 1]
          const bot = mineflayer.createBot({ host: '127.0.0.1', port: 25565, username: role, version })
          const sleep = ms => new Promise(r => setTimeout(r, ms))
          const log = (...a) => console.log(role, ...a)
          let gradeSignal = false
          let filtreDone = false, muetDone = false
          bot.on('messagestr', async (m) => {
            if (role !== 'Acheteur') return
            if (m.includes('test-filtre') && !filtreDone) {
              filtreDone = true
              bot.chat('venez sur monserveur.fr c est mieux'); await sleep(1500)
              bot.chat('SALUT TOUT LE MONDE COMMENT CA VA'); await sleep(1500)
              for (let i = 0; i < 5; i++) { bot.chat('spam numero ' + i); await sleep(150) }
              await sleep(1500); bot.chat('espece de connard')
            }
            if (m.includes('test-muet') && !muetDone) {
              muetDone = true
              await sleep(800); bot.chat('je suis muet ?'); await sleep(1000); bot.chat('/msg Testeur message pendant le mute')
            }
          })
          bot.on('messagestr', m => { if (m.trim()) log('CHAT', m); if (m.includes('test-chat-grade')) gradeSignal = true })
          bot.on('kicked', r => log('KICKED', JSON.stringify(r)))
          bot.on('bossBarCreated', b => log('BOSSBAR', b.title ? b.title.toString() : ''))
          bot.on('error', e => log('BOTERR', e.message))
          bot.on('windowOpen', w => log('WINDOW', w.title ? JSON.stringify(w.title).slice(0, 100) : ''))
          async function cmd(c, wait = 2500) { log('CMD', c); bot.chat(c); await sleep(wait) }
          async function click(slot, wait = 2500) {
            if (!bot.currentWindow) { log('NOWINDOW', slot); return }
            const it = bot.currentWindow.slots[slot]
            log('CLICK', slot, it ? it.name : 'vide'); await bot.clickWindow(slot, 0, 0).catch(e => log('CLICKERR', e.message)); await sleep(wait)
          }
          async function close() { if (bot.currentWindow) bot.closeWindow(bot.currentWindow); await sleep(800) }
          async function testeur() {
            await cmd('/ami ajouter Acheteur', 2000)
            await cmd('salut tout le monde')
            await cmd('Acheteur regarde mon [objet] !', 2000)
            await cmd('/menu'); await click(22); await click(10); await close()
            await cmd('/menu'); await click(19); await close()
            await cmd('/premierspas'); await cmd('/vote'); await cmd('/vote verifier', 12000); await cmd('/vote verifier', 12000); await cmd('/objectif'); await cmd('/bienvenue'); await cmd('/parrain')
            await cmd('/aide'); await click(19); await close()
            await cmd('/help'); await close()
            await cmd('/regles', 2000); await cmd('/aide faq', 2000)
            await cmd('/metiers'); await click(20); await close()
            await cmd('/metiers top'); await close()
            await cmd('/msg Acheteur salut toi'); await cmd('/r merci !')
            await cmd('/report Acheteur test de signalement'); await cmd('/signalements')
            await cmd('/astuces'); await cmd('/astuces'); await cmd('/ignorer'); 
            await cmd('/lmc donner Testeur soutien', 3000)
            await cmd('/lmc actu Test du site | Ceci est une actualité de test.', 3000)
            await cmd('/ami'); await close()
            await cmd('/menu'); await click(47)
            await cmd('/menu'); await click(34); await click(0, 3000); await close()
            await cmd('/succes'); await cmd('/succes menu'); await click(19); await close()
            await cmd('/classement'); await close()
            await cmd('/titres'); await click(10); await close()
            await cmd('/cosmetiques'); await close()
            await cmd('/boutique'); await click(11); await click(11); await close()
            await cmd('/cosmetiques'); await click(10); await close()
            await cmd('/parcours'); await close(); await cmd('/saison'); await close()
            await cmd('/sethome base'); await cmd('/homes'); await close(); await cmd('/home base', 5000)
            await cmd('/setspawn'); await cmd('/spawn', 5000)
            bot.setQuickBarSlot(0); await sleep(500)
            log('HAND', bot.heldItem ? bot.heldItem.name + ' x' + bot.heldItem.count : 'rien')
            await cmd('/hdv vendre 100 2'); await cmd('/hdv'); await close()
            await cmd('/equipe creer Testeurs TST'); await cmd('/equipe inviter Acheteur', 15000)
            await cmd('/tpaccept', 6000)
            await cmd('/lmc holo creer podium'); await cmd('/lmc holo creer saison classement-saison')
            for (const t of ['serveur', 'bienvenue', 'fortune', 'missions', 'grades']) await cmd('/lmc holo creer ' + t, 1500)
            await cmd('/lmc holo liste'); await cmd('/hub', 5000); await cmd('/lobby', 5000)
            await cmd('/titres'); await close()
            await cmd('/gamemode creative'); await cmd('/boss arene'); await cmd('/boss lancer', 4000)
            await cmd('/item replace entity Testeur weapon.mainhand with minecraft:netherite_sword[enchantments={sharpness:255}]', 1500)
            for (let i = 0; i < 40; i++) {
              const e = bot.nearestEntity(en => en.name === 'wither_skeleton')
              if (!e) { log('BOSS introuvable'); break }
              await bot.lookAt(e.position.offset(0, 1, 0)).catch(() => {})
              bot.attack(e); await sleep(500)
            }
            await sleep(3000)
            await cmd('/gamemode survival'); await cmd('/money'); await cmd('/parcours'); await close()
            await cmd('/rtp', 12000); await cmd('/ressources', 14000)
            log('EFFETS', JSON.stringify(bot.entity.effects))
            await cmd('/give Testeur iron_pickaxe'); await cmd('/lmc metier Testeur mineur 1')
            for (let k = 0; k < 4; k++) {
              await cmd('/setblock ~1 ~ ~ minecraft:diamond_ore', 1500)
              try {
                const pick = bot.inventory.items().find(i => i.name === 'iron_pickaxe'); if (pick) await bot.equip(pick, 'hand')
                const ore = bot.blockAt(bot.entity.position.offset(1, 0, 0).floored()); log('MINERAI', ore && ore.name)
                if (ore && ore.name.includes('ore')) { await bot.dig(ore, true); await sleep(1500) }
              } catch (er) { log('DIGERR', er.message) }
            }
            await cmd('/money'); await cmd('/back', 6000)
            await cmd('/lmc saison fin', 4000)
            await cmd('/saison'); await close()
            // Monde du hub, spawn et PNJ
            await cmd('/lyonhub monde', 8000); await cmd('/setspawn')
            await cmd('/lyonhub coller'); await cmd('/lyonhub coller test-hub')
            await cmd('/lyonhub coller test-hub confirmer', 30000)
            const at = (x, y, z) => { const b = bot.blockAt(new (require('vec3'))(x, y, z)); return b ? b.name + JSON.stringify(b.getProperties()) : 'non chargé' }
            log('BLOCS sol', at(0, 64, 0), '| plateforme', at(4, 64, 4), '| clôture', at(0, 65, 5), '| muret', at(0, 65, -5), '| vitre', at(0, 65, 10), '| escalier', at(22, 65, -10))
            await cmd('/lmc holo creer serveur hub-serveur')
            bot.chat('/tp Testeur 0.5 65 12 180 0'); await sleep(2000)
            await cmd('/lmc holo creer ecran', 4000)
            log('ECRAN', Object.values(bot.entities).filter(e => e.name === 'text_display' && e.position.z > 8).length, 'textes')
            bot.chat('/tp Testeur 0.5 65 -3 0 0'); await sleep(2000)
            await cmd('/lyonhub podium succes 1'); await cmd('/lyonhub podium succes 2')
            bot.chat('/tp Testeur 3.5 65 -3 0 0'); await sleep(2000)
            await cmd('/lyonhub pnj jouer Acheteur menu'); await cmd('/lyonhub texte jouer <green>Jouer|<gray>clic droit')
            await cmd('/lyonhub liste')
            bot.chat('/tp Testeur 1.5 65 2 180 0'); await sleep(6000)
            const npcs = Object.values(bot.entities).filter(e => e.type === 'player' && e.username && e.username.startsWith('npc'))
            log('NPCS', npcs.length, npcs.map(e => e.username + '@' + e.position.toString()).join(' '))
            const jouer = npcs.find(e => e.position.x > 2)
            if (jouer) { await bot.activateEntity(jouer).catch(er => log('ACTERR', er.message)); await sleep(2500); await close() }
            // Parkour : départ (12,65,0), étape (14,65,0), arrivée (16,65,0)
            bot.chat('/tp Testeur 12.5 65 0.5'); await sleep(1500); await cmd('/lyonhub parkour depart')
            bot.chat('/tp Testeur 14.5 65 0.5'); await sleep(1500); await cmd('/lyonhub parkour etape')
            bot.chat('/tp Testeur 16.5 65 0.5'); await sleep(1500); await cmd('/lyonhub parkour arrivee')
            bot.chat('/tp Testeur 18.5 65 3.5'); await sleep(1500); await cmd('/lyonhub parkour classement')
            bot.chat('/tp Testeur 9.5 65 0.5 -90 0'); await sleep(2500)
            bot.setControlState('forward', true); await sleep(1200)
            log('PARKOUR INV', bot.inventory.items().map(i => i.name).join(', '))
            await sleep(1600); bot.setControlState('forward', false); await sleep(2000)
            log('APRES PARKOUR', bot.entity.position.floored().toString(), bot.inventory.items().map(i => i.name).join(', '))
            await cmd('/parkour top')
            log('PARKOUR TEXTE', Object.values(bot.entities).filter(e => e.name === 'text_display' && e.position.x > 17).length)
            // Inventaire et règles du hub
            await cmd('/give Testeur diamond 3'); await cmd('/hdv vendre 100')
            await cmd('/missions'); await close()
            bot.setControlState('forward', true); await sleep(3000); bot.setControlState('forward', false)
            log('HUB INV', bot.game.gameMode, bot.inventory.items().map(i => i.name + ' x' + i.count).join(', '))
            // Hub tout fait (/lyonhub installer)
            await cmd('/lyonhub installer'); await cmd('/lyonhub installer confirmer', 5000); await cmd('/lyonhub installer recoller', 120000)
            await cmd('/tp Testeur 30 70 30'); await cmd('/lyonhub installer confirmer', 15000)
            log('HUB FAIT', bot.entity.position.floored().toString(), 'textes', Object.values(bot.entities).filter(e => e.name === 'text_display').length,
              'pnj', Object.values(bot.entities).filter(e => e.type === 'player' && e.username !== 'Testeur').length)
            await cmd('/lyonhub liste'); await cmd('/lmc holo liste'); await cmd('/parkour', 4000)
            log('PARKOUR DEPART', bot.entity.position.floored().toString())
            bot.chat('/tp Testeur 0.5 65 0.5 180 0'); await sleep(2000)
            await cmd('/advancement grant Testeur only minecraft:adventure/sleep_in_bed')
            bot.setQuickBarSlot(0); await sleep(500); bot.activateItem(); await sleep(2500)
            await click(10, 6000)
            log('SURVIE INV', bot.game.gameMode, bot.game.dimension, bot.inventory.items().map(i => i.name + ' x' + i.count).join(', '))
            const posA = bot.entity.position.floored().toString()
            await cmd('/ressources', 14000); log('RESSOURCES', bot.entity.position.floored().toString())
            await cmd('/survie', 6000); log('SURVIE', 'avant', posA, 'après', bot.entity.position.floored().toString())
            await cmd('/advancement grant Testeur only minecraft:adventure/sleep_in_bed')
            for (let i = 0; i < 200 && !gradeSignal; i++) await sleep(1000)
            await cmd('/titres'); await click(47); await click(10); await close()
            await cmd('je suis légende ?')
            log('done')
          }
          async function acheteur() {
            await cmd('/parrain Testeur', 3000)
            await cmd('bonjour tout le monde', 2000)
            await sleep(6000)
            await cmd('/ami accepter', 2000)
            await cmd('/msg Testeur coucou', 2000)
            await cmd('/ami'); await close()
            await sleep(41000)
            for (let i = 0; i < 25; i++) {
              await cmd('/hdv', 2000)
              const it = bot.currentWindow && bot.currentWindow.slots[0]
              if (it && it.name === 'diamond') { await click(0, 2000); await click(11, 3000); break }
              await close(); await sleep(3000)
            }
            await close()
            log('INV', bot.inventory.items().map(i => i.name + ' x' + i.count).join(', '))
            for (let i = 0; i < 6; i++) { await cmd('/equipe rejoindre Testeurs', 3000) }
            await cmd('/tpa Testeur', 12000)
            await cmd('/pay Testeur 500'); await cmd('/money'); await cmd('/equipe info')
            for (let i = 0; i < 200 && !gradeSignal; i++) await sleep(1000)
            await cmd('mon grade est visible ?'); await cmd('/titres'); await close()
            log('done')
          }
          bot.once('spawn', async () => {
            log('spawned', version)
            await sleep(25000)
            try { if (role === 'Testeur') await testeur(); else await acheteur() } catch (e) { log('EXC', e.message) }
            await sleep(2000); bot.quit()
          })
          JS
      - name: Démarrer le serveur et les bots
        run: |
          cd srv
          mkfifo in
          (
            for i in $(seq 1 240); do grep -q "Done (" logs/latest.log 2>/dev/null && break; sleep 1; done
            sleep 3
            (cd ../bot && timeout 1040 node bot.js Testeur > ../bot.log 2>&1 &)
            (cd ../bot && timeout 900 node bot.js Acheteur > ../bot2.log 2>&1 &)
            sleep 12
            for c in "communaute vote Acheteur site-test" "communaute vote Acheteur site-test" "gamerule doMobSpawning false" "kill @e[type=minecraft:slime]" "gamerule keepInventory true" "op Testeur" "op Acheteur" "give Testeur diamond 5" "eco give Testeur 50000" "eco give Acheteur 3000" "advancement grant Testeur only minecraft:story/mine_stone" "advancement grant Testeur only minecraft:adventure/kill_a_mob" "lmc donner Acheteur concours" "lmc donner Testeur inconnu"; do echo "$c"; sleep 1; done
            sleep 20; echo "deop Acheteur"; sleep 2; echo "say test-filtre"; sleep 14
            echo "mute Acheteur 2m test du mute"; sleep 1; echo "say test-muet"; sleep 6
            echo "unmute Acheteur"; sleep 1; echo "avertir Acheteur test d'avertissement"; sleep 1; echo "sanctions Acheteur"; sleep 1; echo "op Acheteur"
            sleep 700
            echo "advancement grant Acheteur from minecraft:story/root"; sleep 5
            echo "advancement grant Testeur everything"; sleep 20
            echo "say test-chat-grade"; sleep 30
            for c in "baltop" "lmc reload"; do echo "$c"; sleep 4; done
            sleep 8
            echo "stop"
          ) > in &
          timeout 1140 java -Xmx2G -jar paper.jar nogui < in > console.log 2>&1 || true
      - name: Analyse des journaux
        if: always()
        run: |
          echo "=== BOT ==="; cat bot.log bot2.log | head -300
          cd srv
          echo "=== LyonAchievements ==="; grep -n "LyonAchievements" logs/latest.log | head -60
          echo "=== Nouveautés ==="; grep -nE "vote|Vérification|installé|HUB FAIT|PARKOUR DEPART|Métier|Mineur|Parkour|parkour|Signalement|MP\]|ami|Lot|lot|Astuce|Centre|Règlement" ../bot.log ../bot2.log logs/latest.log | head -80 || true
          echo "=== Erreurs ==="; grep -nE "Exception|SEVERE|Caused by|at fr\.lyonmc" logs/latest.log | head -80 || true
          grep -E "Exception|SEVERE|Caused by|at fr\.lyonmc" logs/latest.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          grep -E "BOT|KICKED|BOTERR|NOWINDOW|CLICKERR" ../bot.log | head -10 | while IFS= read -r l; do echo "::notice::$l"; done
          grep -E "CHAT" ../bot.log | head -10 | while IFS= read -r l; do echo "::warning::$l"; done
          if grep -qE "at fr\.lyonmc|Error occurred while enabling LyonAchievements" logs/latest.log; then exit 1; fi
      - name: Nettoyer les branches temporaires
        if: always()
        run: git push origin --delete deps deps-jars || true
      - name: Publier les journaux (branche ci-logs)
        if: always()
        run: |
          mkdir -p /tmp/logs && cp bot.log bot2.log /tmp/logs/ 2>/dev/null || true
          cp srv/logs/latest.log /tmp/logs/server.log 2>/dev/null || true
          mkdir -p /tmp/logs/data && cp srv/siteweb/data/*.json /tmp/logs/data/ 2>/dev/null || true
          cp target/LyonAchievements-*.jar hub/build/libs/HUB-*.jar communaute/build/libs/COMMUNAUTE-*.jar /tmp/logs/ 2>/dev/null || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rq --cached . || true
          cp /tmp/logs/*.log . 
          mkdir -p data && cp /tmp/logs/data/*.json data/ 2>/dev/null || true
          cp /tmp/logs/LyonAchievements-*.jar /tmp/logs/HUB-*.jar /tmp/logs/COMMUNAUTE-*.jar . 2>/dev/null || true
          git add bot.log bot2.log server.log data || true
          for f in LyonAchievements-*.jar HUB-*.jar COMMUNAUTE-*.jar; do if [ -f "$f" ]; then git add "$f"; fi; done
          git commit -qm "logs ${{ github.run_id }}"
          git push -qf origin HEAD:ci-logs
