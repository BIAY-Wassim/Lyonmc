name: Test de démarrage

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Compiler
        run: mvn -B -q package
      - name: Préparer le serveur de test
        run: |
          mkdir -p srv/plugins
          URL=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/1.21.8/builds/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['downloads']['server:default']['url'])" || true)
          if [ -z "$URL" ]; then
            B=$(curl -s https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds | python3 -c "import sys,json;print(json.load(sys.stdin)['builds'][-1]['build'])")
            URL=https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/$B/downloads/paper-1.21.8-$B.jar
          fi
          curl -sL -o srv/paper.jar "$URL"
          for P in viaversion viabackwards; do
            V=$(curl -s "https://api.modrinth.com/v2/project/$P/version?loaders=%5B%22paper%22%5D" | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['files'][0]['url'])")
            curl -sL -o srv/plugins/$P.jar "$V"
          done
          cp target/LyonAchievements-*.jar srv/plugins/
          cd srv
          echo "eula=true" > eula.txt
          echo 'online-mode=false' > server.properties
          echo 'level-type=minecraft\:flat' >> server.properties
          echo 'spawn-protection=0' >> server.properties
          echo 'view-distance=4' >> server.properties
          echo 'simulation-distance=4' >> server.properties
          mkdir -p ../bot && cd ../bot && npm init -y >/dev/null && npm install --silent mineflayer >/dev/null
      - name: Écrire le bot
        run: |
          cat > bot/bot.js <<'JS'
          const mineflayer = require('mineflayer')
          const md = require('minecraft-data')
          const versions = md.supportedVersions.pc.filter(v => v.startsWith('1.21'))
          const version = versions.includes('1.21.8') ? '1.21.8' : versions[versions.length - 1]
          console.log('BOT version', version)
          const bot = mineflayer.createBot({ host: '127.0.0.1', port: 25565, username: 'Testeur', version })
          const sleep = ms => new Promise(r => setTimeout(r, ms))
          bot.on('messagestr', m => console.log('CHAT', m))
          bot.on('kicked', r => console.log('KICKED', JSON.stringify(r)))
          bot.on('error', e => console.log('BOTERR', e.message))
          bot.on('windowOpen', w => console.log('WINDOW', w.title ? JSON.stringify(w.title).slice(0, 120) : '', w.slots.length))
          async function cmd(c, wait = 2500) { console.log('CMD', c); bot.chat(c); await sleep(wait) }
          async function click(slot, wait = 2500) {
            if (!bot.currentWindow) { console.log('NOWINDOW for click', slot); return }
            console.log('CLICK', slot); await bot.clickWindow(slot, 0, 0).catch(e => console.log('CLICKERR', e.message)); await sleep(wait)
          }
          async function close() { if (bot.currentWindow) bot.closeWindow(bot.currentWindow); await sleep(800) }
          bot.once('spawn', async () => {
            console.log('BOT spawned')
            await sleep(25000)
            await cmd('salut tout le monde')
            await cmd('/menu'); await click(22); await click(10); await close()
            await cmd('/menu'); await click(19); await close()
            await cmd('/missions'); await click(20 + 0); await close()
            await cmd('/succes'); await cmd('/succes menu'); await click(18 + 1); await close()
            await cmd('/classement'); await close()
            await cmd('/titres'); await click(10); await close()
            await cmd('/cosmetiques'); await close()
            await cmd('/boutique'); await click(10); await click(11); await close()
            await cmd('/parcours'); await close()
            await cmd('/saison'); await close()
            await cmd('/money'); await cmd('/baltop')
            await cmd('/sethome base'); await cmd('/homes'); await close(); await cmd('/home base', 5000)
            await cmd('/setspawn'); await cmd('/spawn', 5000)
            bot.setQuickBarSlot(0); await sleep(500)
            await cmd('/hdv vendre 100 2'); await cmd('/hdv'); await close(); await cmd('/hdv ventes'); await close()
            await cmd('/equipe creer Testeurs TST'); await cmd('/equipe'); await close(); await cmd('/equipe chat'); await cmd('coucou equipe'); await cmd('!coucou tous'); await cmd('/equipe chat')
            await cmd('/equipe top')
            await cmd('/lmc holo creer podium'); await cmd('/lmc holo creer succes tableau'); await cmd('/lmc holo liste')
            await cmd('/boss arene'); await cmd('/boss lancer', 25000); await cmd('/boss stop')
            await cmd('/rtp', 15000)
            await cmd('/ressources', 15000)
            await cmd('/back', 5000)
            await cmd('/missions'); await click(20); await close()
            await cmd('/lmc missions reset Testeur')
            await cmd('/recompense'); await close()
            await cmd('/menu'); await click(51); await close()
            console.log('BOT done')
            bot.quit()
          })
          JS
      - name: Démarrer le serveur et le bot
        run: |
          cd srv
          mkfifo in
          (
            for i in $(seq 1 240); do grep -q "Done (" logs/latest.log 2>/dev/null && break; sleep 1; done
            sleep 3
            (cd ../bot && timeout 400 node bot.js > ../bot.log 2>&1 &)
            sleep 15
            for c in "op Testeur" "give Testeur diamond 5" "eco give Testeur 50000" "advancement grant Testeur only minecraft:story/mine_stone" "advancement grant Testeur only minecraft:story/root" "advancement grant Testeur only minecraft:adventure/kill_a_mob"; do echo "$c"; sleep 2; done
            sleep 200
            for c in "lmc saison fin" "baltop" "lmc reload"; do echo "$c"; sleep 4; done
            sleep 10
            echo "stop"
          ) > in &
          timeout 700 java -Xmx2G -jar paper.jar nogui < in > console.log 2>&1 || true
      - name: Analyse des journaux
        if: always()
        run: |
          echo "=== BOT ==="; cat bot.log | head -200
          cd srv
          echo "=== LyonAchievements ==="; grep -n "LyonAchievements" logs/latest.log | head -60
          echo "=== Erreurs ==="; grep -nE "Exception|SEVERE|Caused by|at fr\.lyonmc" logs/latest.log | head -80 || true
          grep -E "Exception|SEVERE|Caused by|at fr\.lyonmc" logs/latest.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
          grep -E "BOT|KICKED|BOTERR|NOWINDOW|CLICKERR" ../bot.log | head -10 | while IFS= read -r l; do echo "::notice::$l"; done
          grep -E "CHAT" ../bot.log | head -10 | while IFS= read -r l; do echo "::warning::$l"; done
          if grep -qE "at fr\.lyonmc|Error occurred while enabling LyonAchievements" logs/latest.log; then exit 1; fi
      - name: Publier les journaux (branche ci-logs)
        if: always()
        run: |
          mkdir -p /tmp/logs && cp bot.log /tmp/logs/ 2>/dev/null || true
          cp srv/logs/latest.log /tmp/logs/server.log 2>/dev/null || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rq --cached . || true
          cp /tmp/logs/* . 
          git add bot.log server.log
          git commit -qm "logs ${{ github.run_id }}"
          git push -qf origin HEAD:ci-logs
